---
#Network Services Keys - Used to seperate VLAN configuration per VRF
network_services_keys: 
  - name: tenants
  - name: campus
  - name: wifi
  - name: facilities
  - name: l2only

# Define underlay and overlay routing protocol to be used
underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp
#Add for Mulicast support
underlay_multicast: true
evpn_multicast: true

# BGP peer groups passwords
bgp_peer_groups:
  # all passwords set to "arista"
  evpn_overlay_peers:
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
  ipv4_underlay_peers:
    password: 7x4B4rnJhZB438m9+BrBfQ==
  mlag_ipv4_underlay_peer:
    password: 4b21pAdCvWeAqpcKDFMdWw==


# p2p_uplinks_mtu: 9214
p2p_uplinks_mtu: 9214
default_interface_mtu: 9100
# Set default uplink, downlink, and MLAG interfaces based on node type
default_interfaces:
  - types: [ spine ]
    platforms: [ default ]
    uplink_interfaces: [ Ethernet1-8]
    downlink_interfaces: [ Ethernet1-8 ]
  - types: [ l3leaf ]
    platforms: [ default ]
    uplink_interfaces: [ Ethernet7-8 ]
    mlag_interfaces: [ Ethernet11-12 ]
    downlink_interfaces: [ Ethernet8 ]

